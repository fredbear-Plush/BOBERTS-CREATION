<title>DOORS 8-BIT TOP-DOWN</title>

<style>
:root{--bg:#050303;--fg:#e8d9b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050303;--fg:#e8d9b0}}
:root[data-theme="dark"]{--bg:#050303;--fg:#e8d9b0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;align-items:center;justify-content:center;font-family:'Kode Mono',monospace;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
canvas{width:min(100vw,calc(100vh*16/9));image-rendering:pixelated;display:block;background:#000}
#ui{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:6px;font-size:11px;font-weight:700}
#ui label,#ui button{border:2px solid var(--fg);background:#000a;color:var(--fg);padding:7px 8px;font:inherit;cursor:pointer}
#tc{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
#tc>*{pointer-events:auto}
#dp{display:grid;grid-template:repeat(2,46px)/repeat(3,46px);gap:3px}
#tc div.b{border:2px solid var(--fg);background:#0008;display:flex;align-items:center;justify-content:center;font-size:14px;user-select:none;touch-action:none}
@media (hover:hover) and (pointer:fine){#tc{display:none}}
*{font-family:'Kode Mono',monospace!important}
#ui{flex-wrap:wrap;justify-content:flex-end;max-width:72vw}
#login{position:fixed;inset:0;z-index:20;background:#050303f4;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:16px}
#login h1{font-size:44px;color:#e8c060;margin:0;text-shadow:4px 4px #a02020;letter-spacing:4px}
#login p{margin:0;font-size:12px;color:#c8a040}
#login button{border:3px solid var(--fg);background:#000;color:var(--fg);padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;min-width:250px}
#login button:hover{background:#2a1608}
#lmsg{color:#ff8a6a;font-size:11px;max-width:330px;min-height:14px}
.ov{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:#050303e8;padding:12px;box-sizing:border-box}
.pn{width:min(600px,100%);max-height:100%;overflow:auto;border:3px solid #d8b030;background:#0c0603;padding:14px 16px;box-sizing:border-box;color:#e8d9b0;font-size:13px}
.pn h2{margin:0 0 6px;color:#d8b030;font-size:22px;letter-spacing:2px;text-shadow:2px 2px #6a1010}
.pn h3{margin:16px 0 6px;color:#d8b030;font-size:14px}
.pn button,.pn .lb{border:2px solid #e8d9b0;background:#000;color:#e8d9b0;padding:8px 10px;font-weight:700;cursor:pointer;font-size:12px;display:inline-block}
.pn button:hover,.pn .lb:hover{background:#2a1608}.pn button:disabled{opacity:.4;cursor:default}
.pn button.go{border-color:#d8b030;color:#ffd860}
.pn input{background:#000;border:2px solid #887755;color:#e8d9b0;padding:8px;font-size:12px;min-width:0;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sv{display:flex;gap:8px;align-items:center;border:2px solid #3a2a1a;padding:8px;margin:6px 0;flex-wrap:wrap}.sv .nm{flex:1;min-width:140px}
.small{font-size:10px;color:#aa9a78;line-height:1.5}.err{color:#ff8a6a;font-size:11px;min-height:16px;margin:6px 0}
.tag{border:1px solid #ff8a6a;color:#ff8a6a;padding:2px 5px;font-size:10px}.tag.open{border-color:#66cc66;color:#66cc66}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
.pc{border:2px solid #3a2a1a;padding:8px;text-align:center;cursor:pointer;transition:box-shadow .1s}.pc:hover{border-color:#887755}
.pc.talk{border-color:#6ab0ff;box-shadow:0 0 10px #6ab0ff}.pc canvas{width:56px;height:96px;image-rendering:pixelated}.pn2{font-weight:700;color:#ffd860;font-size:12px;word-break:break-all}
</style>

function localDB(){const P='dn|',ls=localStorage,L=new Set(),DC=new Set();let pend=0,pc=0;

 function read(p){const pre=P+p;let out=null;for(const k of keys().filter(k=>k==pre||k.startsWith(pre+'/')).sort((a,b)=>a.length-b.length)){let v;try{v=JSON.parse(ls.getItem(k))}catch(e){continue}
  if(k==pre){out=v;continue}if(!out||typeof out!='object')out={};const rest=k.slice(pre.length+1).split('/');let o=out;for(let j=0;j<rest.length-1;j++)o=dig(o,rest[j]);o[rest[rest.length-1]]=v}return out}
 function wr(p,v){const parts=p.split('/');
  for(let j=1;j<parts.length;j++){const ak=P+parts.slice(0,j).join('/'),s=ls.getItem(ak);if(s!=null){let b;try{b=JSON.parse(s)}catch(e){b={}}if(!b||typeof b!='object')b={};let o=b;const rest=parts.slice(j);for(let q=0;q<rest.length-1;q++)o=dig(o,rest[q]);if(v==null)delete o[rest[rest.length-1]];else o[rest[rest.length-1]]=v;ls.setItem(ak,JSON.stringify(b));return}}
  const pre=P+p;keys().forEach(k=>{if(k.startsWith(pre+'/'))ls.removeItem(k)});if(v==null)ls.removeItem(pre);else ls.setItem(pre,JSON.stringify(v))}
 const fire=()=>{pend=0;L.forEach(l=>{const v=read(l.p),s=JSON.stringify(v);if(s!==l.s){l.s=s;try{l.cb(v)}catch(e){console.error(e)}}})};
 const soon=()=>{if(!pend){pend=1;setTimeout(fire,0)}};
 addEventListener('storage',e=>{if(!e.key||e.key.startsWith(P))soon()});
 addEventListener('pagehide',()=>DC.forEach(p=>{try{wr(p,null)}catch(e){}}));
 const Wr=(p,v)=>{try{wr(p,v==null?null:clean(v))}catch(e){console.warn(e)}soon();return Promise.resolve()};
 return{local:1,set:Wr,update:(p,v)=>{const o=read(p);return Wr(p,Object.assign(o&&typeof o=='object'?o:{},v))},get:p=>Promise.resolve(read(p)),
  on:(p,cb)=>{const l={p,cb};L.add(l);soon();return()=>L.delete(l)},remove:p=>Wr(p,null),onDisc:p=>{DC.add(p);return Promise.resolve()},offDisc:p=>{DC.delete(p);return Promise.resolve()},

 const I=document.getElementById('soFI');I.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')document.getElementById('soFA').click()};
 document.getElementById('soFA').onclick=async()=>{const M=document.getElementById('soFM'),n=cleanName(I.value);if(!n){M.textContent='TYPE A USERNAME';return}const u=await uidOf(n);if(!u){M.textContent='NO PLAYER CALLED '+n;return}if(u===me.uid){M.textContent="THAT'S YOU!";return}if(SO.fr[u]){M.textContent='ALREADY FRIENDS';return}
  if(SO.rq[u]){acceptF(u,SO.rq[u]);return}await D.set('users/'+u+'/freq/'+me.uid,SO.me.name);M.textContent='FRIEND REQUEST SENT TO '+n};
 soP().querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>acceptF(b.dataset.a,SO.rq[b.dataset.a]));
 soP().querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{D.remove('users/'+me.uid+'/freq/'+b.dataset.d);delete SO.rq[b.dataset.d];openFriends()});
 soP().querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const u=b.dataset.r;D.remove('users/'+me.uid+'/friends/'+u);D.remove('users/'+u+'/friends/'+me.uid);delete SO.fr[u];openFriends()});
 soP().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openDM(b.dataset.c));}
async function acceptF(u,n){const D=soDB(),me=SO.me;await D.set('users/'+me.uid+'/friends/'+u,n||'PLAYER');await D.set('users/'+u+'/friends/'+me.uid,me.name);D.remove('users/'+me.uid+'/freq/'+u);D.remove('users/'+u+'/freq/'+me.uid);SO.fr[u]=n;delete SO.rq[u];openFriends()}

 openSo(`<h2>CHAT</h2>${NET&&NET.sid?'<p class=sub>IN A GAME? PRESS T OR ENTER TO CHAT WITH EVERYONE IN YOUR SERVER.</p>':''}${fr.length?fr.map(([u,n])=>`<div class=row><b class=who>${esc(n)}</b>${SO.unread[u]?'<span class=dot>NEW!</span>':''}<button data-c="${u}">OPEN CHAT</button></div>`).join(''):'<p class=sub>ADD FRIENDS FIRST (FRIENDS BUTTON), THEN YOU CAN CHAT WITH THEM ANY TIME - EVEN WHEN YOU ARE NOT IN A GAME.</p>'}<br><button onclick="closeSo()">CLOSE</button>`);
 soP().querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openDM(b.dataset.c));}
function openDM(u){const me=SO.me,D=soDB(),n=SO.fr[u]||'FRIEND',id=chatId(me.uid,u);if(SO.chatUnsub){try{SO.chatUnsub()}catch(e){}}SO.chatWith=u;D.remove('users/'+me.uid+'/inbox/'+u);
 openSo(`<h2>CHAT WITH ${esc(n)}</h2><div class=msgs id=soMs></div><div class=row><input id=soMI maxlength=200 placeholder="TYPE A MESSAGE..."><button id=soMS>SEND</button></div><button id=soBk>BACK</button> <button onclick="closeSo()">CLOSE</button>`);
 const box=document.getElementById('soMs'),I=document.getElementById('soMI');I.focus();
 SO.chatUnsub=D.on('chats/'+id+'/m',v=>{const L=Object.values(v||{}).filter(Boolean).sort((a,b)=>(a.t||0)-(b.t||0)).slice(-60);box.innerHTML=L.map(m=>`<div><b class="${m.u===me.uid?'me':'who'}">${esc(m.n)}:</b> ${esc(m.x)}</div>`).join('')||'<div class=sub>SAY HI!</div>';box.scrollTop=1e9;D.remove('users/'+me.uid+'/inbox/'+u)});
 const send=()=>{const t=I.value.trim().slice(0,200);if(!t)return;I.value='';D.push('chats/'+id+'/m',{u:me.uid,n:me.name,t:tnow2(),x:t});D.set('users/'+u+'/inbox/'+me.uid,1)};
 I.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')send()};document.getElementById('soMS').onclick=send;document.getElementById('soBk').onclick=()=>{if(SO.chatUnsub){SO.chatUnsub();SO.chatUnsub=null}openChat()}}

function gameSay(t){const D=soDB();const hub=G&&G.hub&&!(NET&&NET.sid);if(!D||!(NET&&NET.sid)&&!hub)return;let nm='PLAYER';try{nm=(SO.me&&SO.me.name)||netMe().name}catch(e){}D.push(hub?'hub/chat':'rooms/'+NET.sid+'/chat',{n:nm,t:tnow2(),x:t.slice(0,120)})}
setInterval(()=>{const sid=NET&&NET.sid||(G&&G.hub&&st=='play'?'HUB':null);if(sid!==SO.gsid){if(SO.gUnsub){try{SO.gUnsub()}catch(e){}SO.gUnsub=null}SO.gsid=sid;SO.gmsg=[];const D=soDB();if(sid&&D){const t0=tnow2()-1000;SO.gUnsub=D.on(sid=='HUB'?'hub/chat':'rooms/'+sid+'/chat',v=>{SO.gmsg=Object.values(v||{}).filter(m=>m&&m.t>=t0).sort((a,b)=>a.t-b.t).slice(-6)})}}
 const el=document.getElementById('gchat');if(!el)return;const now=tnow2(),L=(SO.gmsg||[]).filter(m=>now-m.t<12000||document.getElementById('gcin').style.display=='block');el.innerHTML=L.map(m=>`<div><span style="color:#6ab0ff">${esc(m.n)}:</span> ${esc(m.x)}</div>`).join('')+(sid&&st=='play'&&!L.length?'<div style="opacity:.5">T = CHAT</div>':'')},400);

// ---------- admin panel ----------
async function openAdmin(){if(!isAdm()){openSo('<h2>NOT AN ADMIN</h2><button onclick="closeSo()">CLOSE</button>');return}const D=soDB();let users={};try{users=await D.get('users')||{}}catch(e){}
 const rows=Object.entries(users).filter(([u,v])=>v&&v.pub).sort((a,b)=>(b[1].pub.seen||0)-(a[1].pub.seen||0));
 openSo(`<h2>ADMIN PANEL</h2><p class=sub>SIGNED IN AS ${esc(USER.name)} (${esc(USER.email)})</p>
 <h3>TESTING COMMANDS (YOU)</h3><div class=row>
 <button data-x=kit>KIT</button><button data-x=kit2>KIT2 ALL WEAPONS</button><button data-x=door>DOOR ROOM</button><button data-x=own>OWNER MODE</button><button data-x=god>GOD MODE: ${G&&G.god?'ON':'OFF'}</button><button data-x=bk>ENTER BACKROOMS</button><button data-x=seek2>BACTERIA RUN</button><button data-x=lib>LIBRARY (51)</button><button data-x=r100>DOOR 100 FIGURE</button><button data-x=heal>FULL HEAL</button><button data-x=ach>UNLOCK ALL ACHIEVEMENTS</button></div>
 <div class=row><input id=adR placeholder="ROOM NUMBER" maxlength=3 style="max-width:120px"><button data-x=room>GO TO ROOM</button><input id=adK placeholder="AMOUNT" maxlength=7 style="max-width:110px"><button data-x=myk>GIVE ME DOORKNOBS</button><button data-x=myb>GIVE ME VOID</button></div>
 <h3>MAKE A REDEEM CODE</h3><div class=row><input id=adCN placeholder="CODE" maxlength=20><input id=adCK placeholder="DOORKNOBS" maxlength=7 style="max-width:100px"><input id=adCB placeholder="VOID" maxlength=5 style="max-width:80px"><button data-x=mkcode>CREATE CODE</button></div><h3>PLAYERS (${rows.length})</h3><div class=row><input id=adQ placeholder="SEARCH NAME"><input id=adA placeholder="AMOUNT" value="100" maxlength=7 style="max-width:100px"></div>
 <table class=tbl id=adT>${rows.map(([u,v])=>`<tr data-n="${esc(String(v.pub.name||'').toLowerCase())}"><td><b class=who>${esc(v.pub.name||'?')}</b>${v.pub.adm?' <span class=dot>ADMIN</span>':''}<br><span class=sub>${v.pub.knobs|0} KNOBS, ${v.pub.blue|0} VOID - ${tnow2()-(v.pub.seen||0)<70000?'ONLINE':'OFFLINE'}</span></td><td><button data-g=k data-u="${u}">+KNOBS</button><button data-g=b data-u="${u}">+VOID</button><button data-g=kit data-u="${u}">SEND KIT</button><button data-g=msg data-u="${u}">MESSAGE</button></td></tr>`).join('')}</table>
 <p class=sub>USE A MINUS AMOUNT (LIKE -50) TO TAKE CURRENCY AWAY.</p><button onclick="closeSo()">CLOSE</button><div id=adM class=sub></div>`);
 const M=s=>{document.getElementById('adM').textContent=s},Q=document.getElementById('adQ');soP().querySelectorAll('input').forEach(i=>i.onkeydown=e=>e.stopPropagation());
 Q.oninput=()=>{const q=Q.value.toLowerCase();document.querySelectorAll('#adT tr').forEach(tr=>tr.style.display=tr.dataset.n.includes(q)?'':'none')};
 soP().querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const u=b.dataset.u,a=Math.round(+document.getElementById('adA').value||0);
  if(b.dataset.g=='k'||b.dataset.g=='b'){if(!a){M('TYPE AN AMOUNT');return}D.push('users/'+u+'/grants',b.dataset.g=='k'?{k:a,by:USER.name}:{b:a,by:USER.name});M('SENT '+a+(b.dataset.g=='k'?' DOORKNOBS':' VOID'))}
  else if(b.dataset.g=='kit'){D.set('users/'+u+'/cmd',{kit:2});M('SENT A KIT (WORKS WHILE THEY ARE PLAYING)')}else{const t=prompt('MESSAGE:');if(t){D.set('users/'+u+'/cmd',{msg:t});M('MESSAGE SENT')}}});
 soP().querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>adminCmd(b.dataset.x));}
function adminCmd(x){const inGame=st=='play'&&G&&G.R,need=()=>{if(!inGame){TOASTS.push({h:'ADMIN',n:'START A RUN FIRST',t:0});return 0}return 1};
 const amt=Math.round(+((document.getElementById('adK')||{}).value)||0);
 if(x=='kit'){if(need()){closeSo();kitGive(1)}}else if(x=='kit2'){if(need()){closeSo();kitGive(2)}}else if(x=='door'){if(need()){closeSo();doorRoom()}}
 else if(x=='own'){OWN=1;if(G)G.own=1;TOASTS.push({h:'ADMIN',n:'OWNER MODE ON',t:0})}
 else if(x=='god'){if(G){G.god=!G.god;TOASTS.push({h:'ADMIN',n:'GOD MODE '+(G.god?'ON':'OFF'),t:0})}openAdmin();return}
 else if(x=='bk'){closeSo();BKA=1;try{clearRun()}catch(e){}newGame(0,0,1);G.cut={k:'fall',t:0,d:3.4}}
 else if(x=='seek2'){closeSo();BKA=1;try{clearRun()}catch(e){}newGame(0,0,1);G.cut=null;G.runMode=1;G.runDone=0;G.cheat=1;G.room=1;load(1);G.fade=1;G.ekf=1;G.ekcsd=1}
 else if(x=='lib'){closeSo();try{clearRun()}catch(e){}newGame(51,0,1);G.cheat=1}
 else if(x=='r100'){closeSo();try{clearRun()}catch(e){}newGame(99,0,1);G.cheat=1}
 else if(x=='room'){const n=Math.max(0,Math.min(99,+(document.getElementById('adR').value)|0));closeSo();if(inGame&&!G.bk){G.room=n;G.cheat=1;load(n)}else{try{clearRun()}catch(e){}newGame(n,0,1);G.cheat=1}}
 else if(x=='heal'){if(need())G.P.forEach(p=>{p.hp=p.mh||100;p.hun=100;p.dead=0})}
 else if(x=='ach'){ACH.forEach(a=>{PF.ach[a[0]]=PF.ach[a[0]]||Date.now()});save();TOASTS.push({h:'ADMIN',n:'ALL ACHIEVEMENTS UNLOCKED',t:0})}
 else if(x=='mkcode'){const c=String(document.getElementById('adCN').value||'').toUpperCase().replace(/[^A-Z0-9_-]/g,''),k=+document.getElementById('adCK').value||0,b=+document.getElementById('adCB').value||0;if(!c||!k&&!b){TOASTS.push({h:'ADMIN',n:'NEED A CODE + AMOUNT',t:0});return}soDB().set('codes/'+c,{k,b,by:USER.name});TOASTS.push({h:'ADMIN',n:'CODE '+c+' CREATED',t:0})}
 else if(x=='myk'||x=='myb'){if(!amt){TOASTS.push({h:'ADMIN',n:'TYPE AN AMOUNT',t:0});return}if(x=='myk')PF.coins=Math.max(0,(PF.coins|0)+amt);else PF.blue=Math.max(0,(PF.blue|0)+amt);save();soPub();TOASTS.push({h:'ADMIN',n:(amt>0?'+':'')+amt+(x=='myk'?' DOORKNOBS':' VOID'),t:0})}}
// local test mode: tabs without Google login still get a name/friends via the local database
setTimeout(()=>{try{if(!SO.me&&soDB()&&soDB().local&&USER)socialLogin()}catch(e){}},1500);

<script>
// ===================================================================
// SKIN SHOP, REDEEM CODES, THE STARTING ELEVATOR
// ===================================================================
const SKINS=[['cr','gold','GOLDEN CRUCIFIX',300,'#ffcc33'],['cr','blood','BLOOD CRUCIFIX',450,'#d82020'],['cr','void','VOID CRUCIFIX',600,'#9a5cff'],
 ['fl','neon','NEON LIGHTER',150,'#30ffd0'],['fsh','red','RED FLASHLIGHT',150,'#ff3a3a'],['bd','pink','PINK BANDAGES',80,'#ff80c0'],['ck','ruby','RUBY CHEST KEY',120,'#ff4060'],
 ['swd','gold','GOLDEN SWORD',400,'#ffcc33'],['swd','ice','ICE SWORD',350,'#80e0ff'],['dg','toxic','TOXIC DAGGER',250,'#70ff40'],['bw','shadow','SHADOW BOW',300,'#6a4aaa'],['mc','lava','LAVA MACE',350,'#ff6a20']];
const BASEICO={};
function tint2(img,col){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(img,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=.6;x.fillStyle=col;x.fillRect(0,0,c.width,c.height);x.globalAlpha=.35;x.fillStyle='#fff';x.fillRect(0,0,c.width,1);return c}
function applySkins(){PF.skin=PF.skin||{};new Set(SKINS.map(s=>s[0])).forEach(k=>{if(!BASEICO[k]&&ICO[k])BASEICO[k]=ICO[k];if(!BASEICO[k])return;const id=PF.skin[k],sk=SKINS.find(s=>s[0]==k&&s[1]==id);ICO[k]=sk?tint2(BASEICO[k],sk[4]):BASEICO[k]})}
setTimeout(()=>{try{applySkins()}catch(e){}},50);
function skinImg(k,col){const b=BASEICO[k]||ICO[k];if(!b)return'';const t=col?tint2(b,col):b,c=document.createElement('canvas'),z=Math.floor(40/Math.max(t.width,t.height))||1;c.width=t.width*z;c.height=t.height*z;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(t,0,0,c.width,c.height);return c.toDataURL()}
function openSkins(msg){PF.skins=PF.skins||{};PF.skin=PF.skin||{};
 openSo(`<h2>SKIN SHOP</h2><p class=sub>YOU HAVE <b style="color:#ffd860">${PF.coins|0} DOORKNOBS</b>. SKINS ONLY CHANGE HOW YOUR ITEMS LOOK. ${esc(msg||'')}</p>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">${SKINS.map((s,i)=>{const id=s[0]+'_'+s[1],own=PF.skins[id],on=PF.skin[s[0]]==s[1];
  return`<div style="border:2px solid ${on?'#58e858':'#4a3a20'};padding:6px;text-align:center;background:#000"><img src="${skinImg(s[0],s[4])}" style="image-rendering:pixelated;height:40px"><div style="color:#ffd860;font-size:11px;margin:4px 0">${esc(s[2])}</div>${own?`<button data-e="${i}">${on?'EQUIPPED (TAKE OFF)':'EQUIP'}</button>`:`<button data-b="${i}">BUY ${s[3]}</button>`}</div>`}).join('')}</div><br><button onclick="closeSo()">CLOSE</button>`);
 soP().querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const s=SKINS[+b.dataset.b];if((PF.coins|0)<s[3]){openSkins('NOT ENOUGH DOORKNOBS!');return}PF.coins-=s[3];PF.skins[s[0]+'_'+s[1]]=1;PF.skin[s[0]]=s[1];save();applySkins();bp(1000,.15,'square',.07,1600);openSkins('BOUGHT '+s[2]+'!')});
 soP().querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const s=SKINS[+b.dataset.e];if(PF.skin[s[0]]==s[1])delete PF.skin[s[0]];else PF.skin[s[0]]=s[1];save();applySkins();openSkins()})}

// codes: money and items for your next run. Each code works once per player.
const RCODES={WELCOME:{k:100},DOORS:{k:250},AYAN:{k:500},EKREM:{k:300,it:{lp:2}},VOID:{b:5},HOLY:{it:{cr:1}},LIGHTSOUT:{it:{fl:1,fsh:1}},HEALME:{it:{bd:2}},SPEEDY:{it:{shoe:1,vit:1}},LUCKY:{it:{lc:1}},HALLOWEEN:{k:666}};
const ITN={cr:'CRUCIFIX',fl:'LIGHTER',fsh:'FLASHLIGHT',bd:'BANDAGES',lp:'LOCKPICKS',shoe:'RUNNING SHOES',vit:'VITAMINS',lc:'LUCKY COIN',lk:'HEART LOCKET',ln:'OLD LANTERN',ax:'AXE',cb:'CROWBAR',bkey:'VOID KEY',ck:'CHEST KEY'};
function openCodes(msg){PF.codes=PF.codes||{};openSo(`<h2>REDEEM A CODE</h2><p class=sub>CODES GIVE DOORKNOBS, VOID OR ITEMS FOR YOUR NEXT RUN. EACH CODE WORKS ONCE. (SECRET CODES LIKE EKREM ARE TYPED ON THE MENU, NOT HERE.)</p>
 <div class=row><input id=rcI maxlength=24 placeholder="TYPE A CODE"><button id=rcB>REDEEM</button></div><div class=sub id=rcM style="color:#8cff9a;min-height:14px">${esc(msg||'')}</div>
 <h3>USED CODES</h3><p class=sub>${Object.keys(PF.codes).map(esc).join(', ')||'NONE YET'}</p><button onclick="closeSo()">CLOSE</button>`);
 const I=document.getElementById('rcI');I.focus();I.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')document.getElementById('rcB').click()};
 document.getElementById('rcB').onclick=async()=>{const c=String(I.value||'').toUpperCase().replace(/[^A-Z0-9_-]/g,'');const M=t=>document.getElementById('rcM').textContent=t;if(!c){M('TYPE A CODE');return}if(c=='OLD'){goOld();return}if(c=='OLDER'){goOlder();return}if(c=='LOBBY'){closeSo();enterHub();return}if(PF.codes[c]){M('YOU ALREADY USED THAT CODE');return}
  let g=RCODES[c];if(!g){try{const D=soDB();g=D&&await D.get('codes/'+c)}catch(e){}}if(!g){M('THAT CODE DOES NOT EXIST');bp(150,.1);return}
  const out=[];if(g.k){PF.coins=(PF.coins|0)+(+g.k|0);out.push('+'+(g.k|0)+' DOORKNOBS')}if(g.b){PF.blue=(PF.blue|0)+(+g.b|0);out.push('+'+(g.b|0)+' VOID')}
  if(g.it)for(const k in g.it){const v=PF.inv[0];if(v&&k in v||IK.includes(k)){v[k]=(+v[k]||0)+(+g.it[k]|0);if(k=='fl'&&!v.fuel)v.fuel=100;out.push('+'+g.it[k]+' '+(ITN[k]||k.toUpperCase())+' (NEXT RUN)')}}
  PF.codes[c]=Date.now();save();try{soPub()}catch(e){}bp(1200,.2,'square',.08,1700);openCodes('REDEEMED '+c+': '+out.join(', '))}}

// the elevator: before every new run you ride down and can buy items for THIS run
function openElevator(){if(!G||NET&&NET.game)return;G.pz=1;let buyer=0;
 const draw=(msg)=>{const p=G.P[buyer]||G.P[0];openSo(`<div style="background:linear-gradient(#2a2e34,#14161a);border:3px solid #8a9098;padding:10px;margin:-14px -16px"><h2 style="color:#e8e0c8;text-shadow:2px 2px #000">THE ELEVATOR <span style="float:right;color:#ff4a3a;font-family:monospace;background:#000;padding:0 8px">B1 ▼</span></h2>
  <p class=sub>BUY ITEMS FOR THIS RUN BEFORE THE DOORS OPEN. YOU HAVE <b style="color:#ffd860">${PF.coins|0} DOORKNOBS</b>${G.np>1?` &nbsp; BUYING FOR <button id=elB>P${buyer+1} (SWAP)</button>`:''}</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px">${MSH.filter(it=>!it.cur).map((it,i)=>`<div style="border:2px solid #5a6068;background:#0a0b0e;padding:6px"><b style="color:#ffd860">${esc(it.n)}</b><div class=sub style="min-height:26px">${esc(it.d)}</div><button data-i="${MSH.indexOf(it)}">BUY ${it.pr}</button> <span class=sub>HAVE ${p[it.k]|0}</span></div>`).join('')}</div>
  <div class=sub style="color:#8cff9a;min-height:14px;margin-top:6px">${esc(msg||'')}</div><div class=row><button id=elGo style="background:#2a5a2a">OPEN THE DOORS ▶</button></div></div>`);
  const b=document.getElementById('elB');if(b)b.onclick=()=>{buyer=(buyer+1)%G.np;draw()};
  soP().querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=MSH[+b.dataset.i],p=G.P[buyer]||G.P[0],q=it.q||1;if((PF.coins|0)<it.pr){draw('NOT ENOUGH DOORKNOBS');return}if(['vit','shoe','lk','lc','ln','fl','fsh'].includes(it.k)&&p[it.k]){draw('YOU ALREADY HAVE THAT');return}if(invN(p)+q>6){draw('ONLY 6 ITEMS FIT');return}
   PF.coins-=it.pr;save();p[it.k]=(p[it.k]|0)+q;if(it.k=='fl')p.fuel=100;if(it.k=='fsh')p.bat=100;if(it.k=='lk'){p.mh=(p.mh||100)+25;p.hp+=25}bp(1000,.15,'square',.07,1600);draw('BOUGHT '+it.n)});
  document.getElementById('elGo').onclick=elevGo};
 draw();G.elv=1}
function elevGo(){closeSo();if(!G)return;G.pz=0;G.elv=0;G.fade=1;bp(1400,.4,'triangle',.08,1400);setTimeout(()=>bp(1050,.5,'triangle',.08,1050),250);nz(.6,.06,600,200);if(G.R)G.R.fx.push({x:G.P[0].px,y:G.P[0].py-30,t:0,s:'DING! GOOD LUCK...'})}

// ===================================================================
// THE LOBBY: a room you walk around in. Every station opens a part of the game.
// Other players in the lobby show up live (hub/p) and can chat (hub/chat).
// ===================================================================
const HUBST=[['solo','SOLO ELEVATOR','#ffd860'],['coop','CO-OP ELEVATOR','#ffd860'],['online','JOIN GAMES','#8ccaff'],['shop','SHOP','#8cff9a'],['skins','SKINS','#c08cff'],
 ['lb','LEADERBOARDS','#ffb060'],['ach','ACHIEVEMENTS','#ffd860'],['jr','ENTITY JOURNAL','#e8d9b0'],['codes','CODES','#ff8ad0'],['cont','CONTINUE RUN','#8cff9a']];
let HUBO={},HUBU=null,HUBT=0;
function enterHub(){if(NET&&NET.game)return;OLDM=0;const gs=PF.stats.games,rc=RUNC;globalThis.DBGW=1;try{newGame(0,0,1)}finally{globalThis.DBGW=0}PF.stats.games=gs;RUNC=rc;try{if(rc)localStorage.setItem('drun',JSON.stringify(rc))}catch(e){}
 G.hub=1;G.cheat=1;G.cut=null;G.fade=1;st='play';const R=G.R,w=R.w;R.hub=1;R.th='THE LOBBY';R.nod=1;R.noBack=1;R.calm=1;R.noLur=1;
 R.ev=null;R.scr=null;R.eyeE=null;R.sn=[];R.ent=[];R.pk=[];R.fig=null;R.trap=null;R.sec=null;R.mim=null;R.board=null;R.gate=null;R.kl=0;R.locked=0;R.vents=[];R.dark=0;R.tint='rgba(255,200,120,.05)';
 R.fl=[];R.wl=R.wl.filter(o=>o.t=='n'||o.t=='p'||o.t=='k');R.rg=[{c:2,w:Math.max(4,w-4),y:96}].filter(()=>0);try{rebuildCl(R);rebuildSol(R)}catch(e){}
 const L=HUBST.filter(s=>s[0]!='cont'||RUNC&&RUNC.v==1),top=L.slice(0,Math.ceil(L.length/2)),bot=L.slice(top.length),sp=(w*16-64)/Math.max(top.length,bot.length);
 R.hst=[];top.forEach((s,i)=>R.hst.push({k:s[0],n:s[1],c:s[2],x:Math.round(40+sp*(i+.5)),y:64}));bot.forEach((s,i)=>R.hst.push({k:s[0],n:s[1],c:s[2],x:Math.round(40+sp*(i+.5)),y:150}));
 R.hst.forEach(o=>{R.wl=R.wl.filter(q=>Math.abs(q.c*16+8-o.x)>24)});
 G.P.forEach((p,i)=>{p.px=w*8+i*14;p.py=110;p.dir=0});R.entry=null;
 R.fx.push({x:w*8,y:90,t:0,s:'WELCOME TO THE LOBBY - WALK UP TO A STATION AND PRESS E'});hubNet()}
function hubNear(q){return(G.R.hst||[]).find(o=>Math.abs(q.px-o.x)<20&&Math.abs(q.py-(o.y+(o.y<100?2:-8)))<26)}
function hubAct(p){const o=hubNear(p);if(!o)return 0;bp(700,.08,'square',.05,900);const k=o.k;
 if(k=='solo'||k=='coop'){hubLeaveNet();bankSave&&bankSave();newGame(0,0,k=='solo'?1:2);setTimeout(()=>{try{openElevator()}catch(e){}},60)}
 else if(k=='cont'){hubLeaveNet();contRun()}
 else if(k=='online')openServers();else if(k=='skins')openSkins();else if(k=='codes')openCodes();
 else{st='title';M.sub={shop:1,lb:5,ach:4,jr:7}[k];M.sel=0;M.as=0;M.js=0;M.lbc=M.lbc||0;M.retHub=1}
 return 1}
function hubPrompt(q){const o=hubNear(q);return o?o.n:''}
function hubDraw(R,cx,cy){const r=rr(X),t=performance.now()/1000,me=G.P[0];
 (R.hst||[]).forEach(o=>{const x=Math.round(o.x-cx),y=Math.round(o.y-cy),near=me&&Math.abs(me.px-o.x)<20&&Math.abs(me.py-(o.y+(o.y<100?2:-8)))<26;if(x<-60||x>W+60)return;
  const g=X.createRadialGradient(x,y,2,x,y,near?30:20);g.addColorStop(0,o.c+(near?'66':'33'));g.addColorStop(1,o.c+'00');X.fillStyle=g;X.fillRect(x-30,y-30,60,60);
  if(o.k=='solo'||o.k=='coop'){r(x-12,y-26,24,30,'#3a3e44');r(x-10,y-24,20,28,'#8a9098');r(x,y-24,1,28,'#5a6068');r(x-6,y-32,12,5,'#111');r(x-5,y-31,10,3,'#ff4a3a')}
  else if(o.y<100){r(x-11,y-24,22,26,'#2a1608');r(x-9,y-22,18,22,o.k=='lb'?'#1a2a3a':'#3a2414');for(let k=0;k<3;k++)r(x-7,y-19+k*6,14,2,o.c)}
  else{r(x-14,y-6,28,10,'#4a2a14');r(x-14,y-6,28,2,'#7a4a22');r(x-10,y-14,20,8,'#1a1a22');r(x-8,y-12,16,4,o.c)}
  txO(o.n,x,o.y<100?y-36+Math.sin(t*2+o.x)*1:y+16,3,near?'#fff':o.c,'#000','center')});
 for(const u in HUBO){const o=HUBO[u];if(!o||Date.now()-(o.t||0)>8000)continue;const x=Math.round(o.x-cx),y=Math.round(o.y-cy);if(x<-20||x>W+20)continue;
  r(x-5,y-2,10,3,'rgba(0,0,0,.4)');r(x-4,y-14,8,10,o.c||'#3a7ae8');r(x-3,y-20,6,6,'#f0c8a0');r(x-3,y-21,6,2,'#5a3418');r(x-3,y-4,2,4,'#222');r(x+1,y-4,2,4,'#222');txO(String(o.n||'?').slice(0,14),x,y-25,3,'#8ccaff','#000','center')}}
function hubNet(){const D=soDB(),me=soMe();if(!D||!me||HUBU)return;HUBU=D.on('hub/p',v=>{HUBO={};for(const u in v||{})if(u!==me.uid)HUBO[u]=v[u]});try{D.onDisc('hub/p/'+me.uid)}catch(e){}}
function hubLeaveNet(){const D=soDB(),me=soMe();if(D&&me)try{D.remove('hub/p/'+me.uid)}catch(e){}}
setInterval(()=>{if(!G||!G.hub||st!='play'){return}const D=soDB(),me=soMe(),p=G.P&&G.P[0];if(!D||!me||!p)return;if(!HUBU)hubNet();
 if(Date.now()-HUBT>250){HUBT=Date.now();D.set('hub/p/'+me.uid,{x:Math.round(p.px),y:Math.round(p.py),n:me.name,t:Date.now(),c:['#3a7ae8','#e8584a','#58c858','#e8c040','#c060e8'][me.uid.charCodeAt(1)%5]})}},120);
// back to the lobby when you close a menu page you opened from it
setInterval(()=>{if(st=='title'&&M.sub==0&&M.retHub){M.retHub=0;enterHub()}},150);

// after a run ends you land back in the lobby (unless you picked the classic menu with OLD)
let HUBPS='',OLDM=0;setInterval(()=>{if((HUBPS=='dead'||HUBPS=='win')&&st=='title'&&M.sub==0&&!OLDM&&!(NET&&NET.sid))try{enterHub()}catch(e){}HUBPS=st},300);
// OLD = the classic menu, OLDER = the very first version of the game
function goOld(){OLDM=1;hubLeaveNet();M.retHub=0;closeSo();st='title';M.sub=0;M.sel=0;if(G){G.hub=0}TOASTS.push({h:'CLASSIC MENU',n:'TYPE LOBBY (OR PICK IT) TO GO BACK',t:0})}
function goOlder(){hubLeaveNet();closeSo();let f=document.getElementById('ogf');if(!f){f=document.createElement('div');f.id='ogf';f.style.cssText='position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column';
  f.innerHTML='<button id=ogx style="position:absolute;top:6px;left:6px;z-index:2;border:2px solid #e8d9b0;background:#000c;color:#e8d9b0;padding:6px 10px;font:700 12px monospace;cursor:pointer">EXIT THE ORIGINAL DOORS</button><iframe id=ogi style="flex:1;border:0;width:100%;height:100%"></iframe>';document.body.appendChild(f);
  document.getElementById('ogx').onclick=()=>{f.style.display='none';document.getElementById('ogi').src='about:blank';try{goOld()}catch(e){}}}
 f.style.display='flex';const b=new Blob([decodeURIComponent(escape(atob(OGB64)))],{type:'text/html'});document.getElementById('ogi').src=URL.createObjectURL(b);setTimeout(()=>{try{document.getElementById('ogi').focus()}catch(e){}},300)}
